[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snapdraw"
# Unica fonte di verità della versione. sd.__version__ la legge da qui via
# importlib.metadata — non duplicarla nel codice.
version = "0.1.0"
description = "Rilevamento automatico di cornice e cartiglio nei disegni tecnici impaginati — consumatore di forge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Federico Sidraschi" }
]
keywords = ["cad", "dxf", "title-block", "drawing-frame", "iso", "technical-drawing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "shapely>=2.0",
]

# forge NON è qui: è un pacchetto locale, non pubblicato. snapdraw lo usa come
# motore (load_dxf, heal, normalize_role). Installalo a parte:
#   pip install -e ../forge

[project.optional-dependencies]
dev = ["pytest"]
render = ["matplotlib"]   # sd.render_views: importato solo quando si disegna

[tool.setuptools.packages.find]
where = ["."]
include = ["snapdraw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
